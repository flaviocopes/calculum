name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: swift scripts/check-engine.swift
      - run: scripts/test.sh
      - run: scripts/test-cli.sh
      - run: scripts/build-release.sh
